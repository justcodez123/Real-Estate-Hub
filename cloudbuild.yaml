# Google Cloud Build CI/CD Pipeline for Real Estate Hub
# Triggered automatically when pushing changes to the repository.
# Project: project-70b69410-47cf-44c8-833 | Region: asia-south1

substitutions:
  _REGION: asia-south1
  _REPO: real-estate-repo
  _BACKEND_SERVICE: real-estate-backend
  _FRONTEND_SERVICE: real-estate-frontend
  # Set _CLOUD_SQL_INSTANCE in your Cloud Build trigger once Cloud SQL is created:
  # e.g. project-70b69410-47cf-44c8-833:asia-south1:real-estate-pg
  _CLOUD_SQL_INSTANCE: ''
  _DB_USER: springuser
  _DB_NAME: real_estate_db

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # 1. Build Backend Docker Image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-backend'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-backend:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-backend:latest'
      - './Backend'

  # 2. Push Backend Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-backend'
    waitFor: ['build-backend']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-backend'

  # 3. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-backend'
    waitFor: ['push-backend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        EXTRA_FLAGS=""
        if [ -n "${_CLOUD_SQL_INSTANCE}" ]; then
          EXTRA_FLAGS="--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE} --set-env-vars=SPRING_DATASOURCE_URL=jdbc:postgresql:///${_DB_NAME}?cloudSqlInstance=${_CLOUD_SQL_INSTANCE}&socketFactory=com.google.cloud.sql.postgres.SocketFactory,DB_USER=${_DB_USER} --set-secrets=DB_PASS=db-pass:latest"
        fi
        gcloud run deploy ${_BACKEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-backend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --service-account=real-estate-deployer-sa@$PROJECT_ID.iam.gserviceaccount.com \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=0 \
          --max-instances=2 \
          --quiet \
          $${EXTRA_FLAGS}

        gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)' > /workspace/backend_url.txt
        echo "Backend deployed at: $(cat /workspace/backend_url.txt)"

  # 4. Build Frontend Docker Image with live Backend API URL
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-frontend'
    waitFor: ['deploy-backend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        BACKEND_URL=$(cat /workspace/backend_url.txt)
        docker build \
          --build-arg VITE_API_URL="$${BACKEND_URL}/api" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-frontend:$COMMIT_SHA" \
          -t "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-frontend:latest" \
          ./real-estate-frontend

  # 5. Push Frontend Image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-frontend'
    waitFor: ['build-frontend']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-frontend'

  # 6. Deploy Frontend to Cloud Run & Sync Backend CORS Origin
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-frontend'
    waitFor: ['push-frontend']
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        gcloud run deploy ${_FRONTEND_SERVICE} \
          --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-frontend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --port=8080 \
          --min-instances=0 \
          --max-instances=2 \
          --quiet

        FRONTEND_URL=$(gcloud run services describe ${_FRONTEND_SERVICE} --region=${_REGION} --format='value(status.url)')
        echo "Frontend deployed at: $${FRONTEND_URL}"

        gcloud run services update ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --update-env-vars="^@^CORS_ALLOWED_ORIGINS=$${FRONTEND_URL},http://localhost:5173" \
          --quiet

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-backend:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/real-estate-frontend:$COMMIT_SHA'
